<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - CartoDigital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), #2563eb);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }

        .brand-icon svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-hover), #1d4ed8);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.4;
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .password-match-hint {
            font-size: 12px;
            margin-top: 6px;
            transition: color 0.2s;
        }

        .match-valid { color: var(--success); }
        .match-invalid { color: var(--danger); }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8componentZ"/>
                </svg>
            </div>
            <h1>CartoDigital</h1>
            <p>Restablecer Contraseña de Usuario</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="reset-form" onsubmit="handleResetPassword(event)">
            <div class="form-group">
                <label for="password">Nueva Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="7" oninput="validatePasswords()">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required minlength="7" oninput="validatePasswords()">
                <div id="match-hint" class="password-match-hint"></div>
            </div>

            <button type="submit" id="btn-submit" class="btn-submit">
                Restablecer Contraseña
            </button>
        </form>
    </div>

    <script>
        // Obtener el token de la URL query string (?token=XYZ)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const alertBox = document.getElementById('alert-box');
        const matchHint = document.getElementById('match-hint');
        const btnSubmit = document.getElementById('btn-submit');

        if (!token) {
            showAlert('El enlace de recuperación es inválido o no contiene un token válido.', 'danger');
            btnSubmit.disabled = true;
        }

        function showAlert(message, type) {
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
        }

        function validatePasswords() {
            const pwd = document.getElementById('password').value;
            const confirmPwd = document.getElementById('confirm-password').value;

            if (!confirmPwd) {
                matchHint.textContent = '';
                return false;
            }

            if (pwd === confirmPwd) {
                matchHint.textContent = '✓ Las contraseñas coinciden';
                matchHint.className = 'password-match-hint match-valid';
                return true;
            } else {
                matchHint.textContent = '✕ Las contraseñas no coinciden';
                matchHint.className = 'password-match-hint match-invalid';
                return false;
            }
        }

        async function handleResetPassword(event) {
            event.preventDefault();
            showAlert('', 'none');
            alertBox.style.display = 'none';

            const pwd = document.getElementById('password').value;
            const confirmPwd = document.getElementById('confirm-password').value;

            if (pwd.length < 7) {
                showAlert('La contraseña debe tener al menos 7 caracteres.', 'danger');
                return;
            }

            if (pwd !== confirmPwd) {
                showAlert('Las contraseñas no coinciden. Por favor verifíquelas.', 'danger');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner"></span> Procesando...';

            try {
                const response = await fetch('/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        new_password: pwd
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('¡Contraseña restablecida exitosamente! Ya puedes iniciar sesión con tu nueva contraseña.', 'success');
                    document.getElementById('reset-form').reset();
                    matchHint.textContent = '';
                    btnSubmit.innerHTML = '✓ Completado';
                } else {
                    showAlert(data.detail || 'Error al restablecer la contraseña. El enlace puede haber expirado.', 'danger');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Reintentar';
                }
            } catch (err) {
                showAlert('Error de conexión con el servidor. Verifique su conexión.', 'danger');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Restablecer Contraseña';
            }
        }
    </script>
</body>
</html>
