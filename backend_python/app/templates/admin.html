<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CartoDigital — Panel de Administración PostGIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 p-2 rounded-lg text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-wide">CartoDigital PostGIS</h1>
        <p class="text-xs text-slate-400">Gestión de Capas y Visor Geográfico Neon</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        ● Neon Connected
      </span>
    </div>
  </header>

  <!-- Content -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Panel Lateral de Capas -->
    <aside class="w-96 bg-slate-800 border-r border-slate-700 flex flex-col">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center">
        <h2 class="font-semibold text-slate-200">Catálogo de Capas</h2>
        <button onclick="cargarCapas()" class="p-1.5 hover:bg-slate-700 rounded-md text-slate-400 hover:text-white transition">
          🔄 Recargar
        </button>
      </div>
      <div id="lista-capas" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Render dinámico de capas -->
      </div>
    </aside>

    <!-- Mapa Leaflet -->
    <main class="flex-1 relative">
      <div id="map" class="w-full h-full bg-slate-950"></div>
    </main>
  </div>

  <script>
    const map = L.map('map').setView([14.5, -90.5], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let capasGroup = L.layerGroup().addTo(map);

    async function cargarCapas() {
      try {
        const res = await fetch('/api/capas/todas');
        const capas = await res.json();
        renderizarCapasLista(capas);
        actualizarMapa(capas);
      } catch (err) {
        console.error('Error cargando capas:', err);
      }
    }

    function renderizarCapasLista(capas) {
      const container = document.getElementById('lista-capas');
      container.innerHTML = '';

      capas.forEach(c => {
        const div = document.createElement('div');
        div.className = `p-4 rounded-xl border transition-all ${
          c.activa 
            ? 'bg-slate-700/50 border-slate-600' 
            : 'bg-slate-800/40 border-slate-800 opacity-60'
        }`;

        div.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <span class="w-4 h-4 rounded-full" style="background-color: ${c.color}"></span>
              <div>
                <h3 class="font-semibold text-sm text-slate-100">${c.nombre}</h3>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider font-mono">${c.tipo_geometria} — ${c.tabla_origen}</span>
              </div>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" ${c.activa ? 'checked' : ''} onchange="toggleCapa('${c.id}', this.checked)">
              <div class="w-9 h-5 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
            </label>
          </div>
        `;
        container.appendChild(div);
      });
    }

    async function toggleCapa(id, activa) {
      try {
        await fetch(`/api/capas/${id}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ activa: activa })
        });
        cargarCapas();
      } catch (e) {
        console.error('Error toggling capa:', e);
      }
    }

    async function actualizarMapa(capas) {
      capasGroup.clearLayers();
      for (const c of capas) {
        if (!c.activa) continue;
        try {
          const res = await fetch(`/api/capas/${c.tabla_origen}/features`);
          const data = await res.json();
          L.geoJSON(data, {
            style: { color: c.color, weight: 3, opacity: 0.8 },
            pointToLayer: (feature, latlng) => L.circleMarker(latlng, { radius: 6, fillColor: c.color, color: '#fff', weight: 1, fillOpacity: 0.9 })
          }).addTo(capasGroup);
        } catch (e) {
          console.error(`Error dibujando ${c.tabla_origen}:`, e);
        }
      }
    }

    cargarCapas();
  </script>
</body>
</html>
